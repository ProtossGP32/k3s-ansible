---
# The grep probes below must run in check mode as well. The command module does
# not execute under --check, it returns rc 0 with "Command would have run if not
# in check mode", which would otherwise mark every host as a Jetson and make
# check runs apply the distro specific setup and teardown tasks. The rc values
# mean: 0 matched, 1 no match, 2 the file is absent (no /proc/device-tree on non
# ARM systems). The /etc/nv_tegra_release stat probe is check mode safe on its
# own, so a real Jetson stays detectable even if the greps cannot run.
- name: Test for Jetson /proc/device-tree/model
  ansible.builtin.command: grep -Ei "Jetson|TEGRA" /proc/device-tree/model
  register: grep_device_tree_model_jetson
  failed_when: false
  changed_when: false
  check_mode: false

- name: Test for Jetson /proc/device-tree/compatible
  ansible.builtin.command: grep -Ei "nvidia,tegra|nvidia,p3767" /proc/device-tree/compatible
  register: grep_device_tree_compatible_jetson
  failed_when: false
  changed_when: false
  check_mode: false

- name: Test for /etc/nv_tegra_release
  ansible.builtin.stat:
    path: /etc/nv_tegra_release
  register: stat_nv_tegra_release

- name: Set is_jetson fact to true
  ansible.builtin.set_fact:
    is_jetson: true
  when: >-
    (grep_device_tree_model_jetson.rc | default(1)) == 0 or
    (grep_device_tree_compatible_jetson.rc | default(1)) == 0 or
    (stat_nv_tegra_release.stat.exists | default(false))

- name: Set is_jetson default fact to false
  ansible.builtin.set_fact:
    is_jetson: false
  when: is_jetson is not defined

- name: Execute OS related tasks on the Jetson - {{ action_ }}
  ansible.builtin.include_tasks: "{{ action_ }}.yml"
  vars:
    action_: >-
      {% if state == "present" %}setup{% else %}teardown{% endif %}
  when: is_jetson | bool
